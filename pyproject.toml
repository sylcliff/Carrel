[project]
name = "carrel"
version = "0.1.0"
description = "Carrel — a self-hosted single-user paper reading room"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "socksio>=1.0",  # SOCKS proxy support for httpx (used when HTTPS_PROXY is socks5://)
    "litellm>=1.51",
    "pyalex>=0.16",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "symspellpy>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["carrel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends()/Query() in argument defaults is the intended pattern
    "UP007",  # we keep X | Y in runtime annotations (py311 supports it natively)
    "UP042",  # `class X(str, Enum)` is the safe/established pattern for Pydantic/SQLModel
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
